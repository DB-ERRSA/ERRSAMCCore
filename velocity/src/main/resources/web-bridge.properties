# Website endpoint receiving the proxy-owned snapshot.
endpoint=https://errsa-minecraft-handbook.onrender.com/api/bridge/velocity
# Set the same shared secret configured on the website.
secret=CHANGE_ME_AND_MATCH_RENDER_PROXY_BRIDGE_SECRET
# Seconds between snapshots; minimum 10 seconds.
interval-seconds=15
# Include online player names and UUIDs in the snapshot.
include-online-players=true
# Existing read-only proxy data sources; do not move these files.
playtime-file=plugins/RankProgressionProxy/playtime-data.yml
eventbridge-file=plugins/eventbridge/eventbridge-state.json
