# ERRSA Velocity Core: enable each independent module here.
# Restart the proxy after changing these switches.
modules.compatibility-velocity.enabled=true
modules.web-bridge.enabled=true
# WikiSync writes to GitHub on startup. Enable after checking its repo/branch.
modules.wiki-sync.enabled=false
# Via updater stages updates for later restarts. Disabled until manually reviewed.
modules.auto-via-updater.enabled=false
