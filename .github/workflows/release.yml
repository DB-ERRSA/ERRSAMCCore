name: Release Paper and Velocity JARs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build both Maven modules
        run: mvn -B --no-transfer-progress clean verify
      - name: Package exact deployable JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for module in paper velocity; do
            mapfile -t jars < <(find "$module/target" -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "Expected one deployable JAR for $module; found ${#jars[@]}" >&2
              exit 1
            fi
            cp "${jars[0]}" dist/
          done
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 2
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -lh dist/
      - name: Publish release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt --title "ERRSA Core $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ERRSA-Core-release-candidate-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
